<title>예진미디어 영상편집</title>
<meta name="description" content="예진미디어 영상편집. Final Cut, After Effects, Motion, Photoshop으로 숏폼·다큐·자막·썸네일을 납품합니다. 서울 · 010-3333-4763" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  :root { --bg:#000000; --surface:#111111; --fg:#ffffff; --muted:#aaaaaa; --accent:#ffffff; --ink:#000000; --line:#222222; }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin:0; color:var(--fg); font-family:Pretendard,"Apple SD Gothic Neo",sans-serif; line-height:1.55; -webkit-font-smoothing:antialiased; background:#000000; }
  body::before { content:""; position:fixed; inset:0; z-index:0; pointer-events:none; background:none; }
  header, main, footer { position:relative; z-index:1; }
  a { color:inherit; text-decoration:none; }
  img { max-width:100%; display:block; }
  .wrap { width:min(1120px, calc(100% - 40px)); margin:0 auto; }
  header { position:sticky; top:0; z-index:20; background:rgba(0,0,0,.85); backdrop-filter:blur(16px); border-bottom:1px solid var(--line); }
  .nav { display:flex; align-items:center; justify-content:space-between; height:64px; }
  .logo small { display:block; color:var(--muted); font-size:11px; letter-spacing:.08em; }
  nav a { color:var(--muted); margin-left:22px; font-size:14px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; height:44px; padding:0 18px; border-radius:999px; background:#ffffff; color:#000000; font-weight:800; border:0; font:inherit; cursor:pointer; }
  .ghost { background:transparent; color:var(--fg); border:1px solid var(--line); }
  h1 { font-size:clamp(40px,6vw,72px); line-height:.98; letter-spacing:-.04em; margin:14px 0 16px; }
  h2 { font-size:clamp(28px,4vw,40px); letter-spacing:-.04em; margin:0 0 8px; }
  h1,h2,h3 { text-wrap:balance; }
  .muted { color:var(--muted); }
  .kicker { color:var(--accent); font-size:13px; font-weight:800; letter-spacing:.14em; }
  section { padding:56px 0; }
  .hero { padding-top:64px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; margin-top:22px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .grid4 { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .card { background:#111111; border:1px solid var(--line); border-radius:18px; padding:20px; }
  .tag { display:inline-block; background:#ffffff; color:#000000; border-radius:999px; font-size:12px; font-weight:800; padding:2px 8px; }
  .step { border-top:2px solid var(--accent); padding-top:12px; }
  figure { margin:36px 0 0; overflow:hidden; border:1px solid var(--line); border-radius:18px; background:var(--surface); }
  .slides { position:relative; aspect-ratio:3/1; background:#000; }
  .slides img { position:absolute; inset:0; width:100%; height:100%; max-width:none; object-fit:cover; opacity:0; transition:opacity .7s ease; }
  .slides img.on { opacity:1; }
  .dots { position:absolute; z-index:2; left:16px; bottom:14px; display:flex; gap:8px; }
  .dots button { width:12px; height:12px; border-radius:50%; border:0; padding:0; background:rgba(255,255,255,.5); }
  .dots button.on { background:#ffffff; }
  .samples { display:flex; flex-wrap:wrap; gap:16px; align-items:flex-start; margin-top:28px; }
  .short { width:min(360px,100%); aspect-ratio:9/16; overflow:hidden; border:1px solid var(--line); border-radius:18px; background:#000; }
  .wide { flex:1; min-width:min(100%,420px); aspect-ratio:16/9; overflow:hidden; border:1px solid var(--line); border-radius:18px; background:#000; }
  .short iframe, .wide iframe { width:100%; height:100%; border:0; }
  figcaption { padding:18px 20px 22px; }
  label { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
  input, select, textarea { width:100%; background:#0a0a0a; color:var(--fg); border:1px solid var(--line); border-radius:12px; padding:12px; font:inherit; }
  textarea { min-height:110px; }
  .full { grid-column:1 / -1; }
  .days { font-size:32px; font-weight:800; color:var(--accent); margin:4px 0 0; }
  .past { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:22px; }
  .past figure { margin:0; }
  .past img { width:100%; aspect-ratio:16/9; object-fit:contain; background:#000000; }
  .past figcaption { padding:12px 14px; font-weight:700; }
  footer { border-top:1px solid var(--line); padding:28px 0 40px; color:var(--muted); font-size:13px; }
  button { cursor:pointer; }
  @media (max-width:800px) {
    nav a { display:none; }
    .grid2,.grid3,.grid4,.past { grid-template-columns:1fr; }
    .slides { aspect-ratio:16/9; }
  }
</style>
</head>
