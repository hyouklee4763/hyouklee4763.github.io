<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>예진미디어 영상편집</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  :root { --bg:#000; --fg:#fff; --muted:#aaa; --line:#222; }
  body { margin:0; color:var(--fg); font-family:Pretendard,sans-serif; background:#000; }
  .wrap { width:min(1120px, calc(100% - 40px)); margin:0 auto; }
  header { position:sticky; top:0; background:rgba(0,0,0,.85); border-bottom:1px solid var(--line); }
  .nav { display:flex; align-items:center; justify-content:space-between; height:64px; }
  .slides { position:relative; aspect-ratio:3/1; background:#000; }
  .slides img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .7s ease; }
  .slides img.on { opacity:1; }
</style>
</head>
<body>
<header><div class="wrap nav"><b>예진미디어</b></div></header>
<main>
  <section>
    <div class="wrap">
      <h1>영상편집</h1>
      <div class="slides" id="hero-slides">
        <img class="on" src="hero/2.jpg" alt="슬라이드 1" />
        <img src="hero/3.jpg" alt="슬라이드 2" />
        <img src="king-master-wide.jpg" alt="슬라이드 3" />
      </div>
    </div>
  </section>
</main>
<script>
(function(){
  const slides = document.querySelectorAll("#hero-slides img");
  if (slides.length < 2) return;
  let i = 0;
  setInterval(() => {
    slides[i].classList.remove("on");
    i = (i + 1) % slides.length;
    slides[i].classList.add("on");
  }, 4000);
})();
</script>
</body>
</html>
