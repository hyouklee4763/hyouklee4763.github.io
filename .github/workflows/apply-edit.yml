name: apply homepage edit
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
jobs:
  apply:
    if: github.event.issue.user.login == 'hyouklee4763' && startsWith(github.event.issue.title, '홈페이지 수정')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: write site.json
        run: |
          python3 << 'PY'
          import base64, json, os, pathlib, re, time, urllib.request
          event = json.loads(pathlib.Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          body = (event.get("issue") or {}).get("body") or ""
          match = re.search(r"===SITE===\s*(.*?)\s*===END===", body, re.S)
          result = "EMPTY"
          if match:
              try:
                  data = json.loads(match.group(1))
                  slides = data.get("슬라이드") or []
                  local = []
                  stamp = str(int(time.time()))
                  for i, url in enumerate(slides[:3], 1):
                      url = str(url).strip()
                      if url.startswith("data:"):
                          dest = pathlib.Path("hero") / f"{i}.jpg"
                          dest.parent.mkdir(exist_ok=True)
                          raw = re.sub(r"\s+", "", url.split(",", 1)[1])
                          dest.write_bytes(base64.b64decode(raw))
                          local.append(f"hero/{i}.jpg?v={stamp}")
                      elif url.startswith("http://") or url.startswith("https://"):
                          dest = pathlib.Path("hero") / f"{i}.jpg"
                          dest.parent.mkdir(exist_ok=True)
                          saved = False
                          for _try in range(3):
                              try:
                                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                                  with urllib.request.urlopen(req, timeout=60) as res:
                                      dest.write_bytes(res.read())
                                  local.append(f"hero/{i}.jpg?v={stamp}")
                                  saved = True
                                  break
                              except Exception:
                                  pass
                          if not saved:
                              local.append(url)
                      else:
                          local.append(url)
                  if local:
                      data["슬라이드"] = local
                  pathlib.Path("site.json").write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
                  result = "OK"
              except Exception:
                  result = "FAIL"
          pathlib.Path("apply-result.txt").write_text(result, encoding="utf-8")
          PY
      - name: commit
        run: |
          result=$(cat apply-result.txt 2>/dev/null || echo FAIL)
          if [ "$result" != "OK" ]; then exit 0; fi
          git config user.email "338364348+hyouklee4763@users.noreply.github.com"
          git config user.name "hyouklee4763"
          git add site.json
          if [ -d hero ]; then git add hero; fi
          git diff --cached --quiet || git commit -m "홈페이지 글 수정"
          git push
      - name: close issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const result = fs.existsSync("apply-result.txt") ? fs.readFileSync("apply-result.txt", "utf8").trim() : "FAIL";
            const note = {
              OK: "홈페이지에 반영했습니다. 1–2분 뒤 홈페이지 탭을 닫고 https://hyouklee4763.github.io 만 다시 여세요.",
              EMPTY: "붙여넣은 글이 없습니다. 수정 화면에서 복사한 글을 GitHub의 큰 칸에 붙여넣고 이슈를 다시 만들어 주세요.",
              FAIL: "사진을 저장하지 못했습니다. JPG로 다시 골라 주세요."
            }[result] || "사진을 저장하지 못했습니다. JPG로 다시 골라 주세요.";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: note
            })
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed"
            })
