<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>예진미디어 글 수정</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  :root { --bg:#10110e; --surface:#181b14; --fg:#f4efe4; --muted:#b2ab9c; --accent:#d6ff3e; --ink:#14160c; --line:#2e3326; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:Pretendard,"Apple SD Gothic Neo",sans-serif; line-height:1.5; }
  .wrap { width:min(720px, calc(100% - 32px)); margin:0 auto; padding:32px 0 64px; }
  h1 { font-size:32px; letter-spacing:-.04em; margin:0 0 8px; }
  p { color:var(--muted); }
  label { display:block; margin:16px 0 6px; font-size:13px; color:var(--muted); }
  input, textarea { width:100%; background:#10120c; color:var(--fg); border:1px solid var(--line); border-radius:12px; padding:12px; font:inherit; }
  textarea { min-height:88px; }
  button, .btn { display:inline-flex; align-items:center; justify-content:center; height:48px; padding:0 18px; border-radius:999px; background:var(--accent); color:var(--ink); font-weight:800; border:0; font:inherit; cursor:pointer; text-decoration:none; }
  .ghost { background:transparent; color:var(--fg); border:1px solid var(--line); }
  .row { display:flex; gap:10px; flex-wrap:wrap; margin-top:22px; }
  .note { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; }
  .ok { color:var(--accent); font-weight:700; }
  img.preview { width:100%; border-radius:12px; margin-top:8px; }
</style>
</head>
<body>
<main class="wrap">
  <h1>홈페이지 글 수정</h1>
  <p>비밀번호만 넣으면 됩니다. 토큰은 필요 없습니다. 글을 고친 뒤 <b style="color:#f4efe4">홈페이지에 반영</b>을 누르고, 열리는 창에서 초록색 버튼만 한 번 누르세요.</p>
  <div id="lock" class="note">
    <label>비밀번호</label>
    <input id="gate" type="password" autocomplete="current-password" />
    <div class="row"><button type="button" id="open">들어가기</button></div>
    <p id="gateerr"></p>
  </div>
  <form id="form" hidden>
    <label>작은 제목</label>
    <input id="작은제목" />
    <label>큰 제목 (줄 바꾸려면 엔터)</label>
    <textarea id="큰제목"></textarea>
    <label>소개</label>
    <textarea id="소개"></textarea>
    <label>상담 문구</label>
    <input id="상담문구" />
    <label>경력</label>
    <textarea id="경력"></textarea>
    <label>전화번호</label>
    <input id="전화번호" />
    <label>주소</label>
    <input id="주소" />
    <label>숏츠 주소 (한 줄에 하나)</label>
    <textarea id="숏츠"></textarea>
    <label>가로 영상 주소 (한 줄에 하나)</label>
    <textarea id="가로영상"></textarea>
    <label>영상 게시판 (한 줄에 하나, 제목 | 주소)</label>
    <textarea id="게시판" style="min-height:140px"></textarea>
    <label>슬라이드 1번 사진</label>
    <img id="pv1" class="preview" alt="" src="king-master-wide.jpg?v=3">
    <input id="slide1" type="file" accept="image/*">
    <label>슬라이드 2번 사진</label>
    <img id="pv2" class="preview" alt="" src="work/table.png">
    <input id="slide2" type="file" accept="image/*">
    <label>슬라이드 3번 사진</label>
    <img id="pv3" class="preview" alt="" src="work/theme-trip.png">
    <input id="slide3" type="file" accept="image/*">
    <p>바꾸고 싶은 칸만 사진을 고르세요. 고르지 않은 칸은 그대로 둡니다.</p>
    <div class="row">
      <button type="submit">홈페이지에 반영</button>
      <a class="btn ghost" href="./">사이트로 돌아가기</a>
    </div>
    <p id="msg"></p>
  </form>
</main>
<script>
const PIN = "yejin4763";
const REPO = "hyouklee4763/hyouklee4763.github.io";
const KEYS = ["작은제목","큰제목","소개","상담문구","경력","전화번호","주소"];
const gate = document.getElementById("gate");
document.getElementById("open").onclick = () => {
  if (gate.value !== PIN) { document.getElementById("gateerr").textContent = "비밀번호가 다릅니다."; return; }
  document.getElementById("lock").hidden = true;
  document.getElementById("form").hidden = false;
  boot();
};
function token(){ return localStorage.getItem("yejin-gh-token") || ""; }
function paintToken(){}
let loaded = {};
document.getElementById("form").onsubmit = async (e) => {
  e.preventDefault();
  const msg = document.getElementById("msg");
  msg.className = "";
  msg.textContent = "사진을 올리는 중입니다.";
  try {
    const s = collect();
    const slides = (loaded.슬라이드 && loaded.슬라이드.slice()) || [
      "king-master-wide.jpg?v=3",
      "work/table.png",
      "work/theme-trip.png"
    ];
    for (let i = 0; i < 3; i++) {
      const file = document.getElementById("slide" + (i + 1)).files[0];
      if (file) slides[i] = await uploadPhoto(file);
    }
    s.슬라이드 = slides;
    const body = "===SITE===\n" + JSON.stringify(s) + "\n===END===";
    const url = "https://github.com/hyouklee4763/hyouklee4763.github.io/issues/new?title=" + encodeURIComponent("홈페이지 수정") + "&body=" + encodeURIComponent(body);
    window.open(url, "_blank", "noopener");
    msg.className = "ok";
    msg.textContent = "열린 창에서 초록색 Submit new issue 버튼만 누르세요. 1–2분 뒤 사이트를 새로고침하면 사진이 바뀝니다.";
  } catch (err) {
    msg.className = "";
    msg.textContent = "사진을 올리지 못했습니다. 다른 사진으로 다시 해 주세요.";
  }
};
function shrink(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const max = 1400;
      const scale = Math.min(1, max / img.width, max / img.height);
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(img.width * scale));
      canvas.height = Math.max(1, Math.round(img.height * scale));
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error("blob")), "image/jpeg", 0.82);
    };
    img.onerror = () => reject(new Error("image"));
    img.src = URL.createObjectURL(file);
  });
}
async function uploadPhoto(file) {
  const blob = await shrink(file);
  const fd = new FormData();
  fd.append("file", blob, "slide.jpg");
  const res = await fetch("https://telegra.ph/upload", { method: "POST", body: fd });
  const data = await res.json();
  if (!data[0] || !data[0].src) throw new Error("upload");
  return "https://telegra.ph" + data[0].src;
}
[1,2,3].forEach(i => {
  document.getElementById("slide" + i).onchange = () => {
    const file = document.getElementById("slide" + i).files[0];
    const img = document.getElementById("pv" + i);
    if (!file) return;
    img.src = URL.createObjectURL(file);
  };
});
function lines(id){ return document.getElementById(id).value.split(/\n/).map(s => s.trim()).filter(Boolean); }
function collect(){
  const s = {};
  KEYS.forEach(k => s[k] = document.getElementById(k).value.trim());
  s.숏츠 = lines("숏츠");
  s.가로영상 = lines("가로영상");
  s.게시판 = lines("게시판").map(line => {
    const cut = line.indexOf("|");
    if (cut < 0) return { 제목: "영상", 주소: line };
    return { 제목: line.slice(0, cut).trim(), 주소: line.slice(cut + 1).trim() };
  }).filter(item => item.주소);
  return s;
}
function fill(s){
  KEYS.forEach(k => { if (s[k]) document.getElementById(k).value = s[k]; });
  document.getElementById("숏츠").value = (s.숏츠 || s["싷츠"] || []).join("\n");
  document.getElementById("가로영상").value = (s.가로영상||[]).join("\n");
  document.getElementById("게시판").value = (s.게시판||[]).map(item => item.제목 + " | " + item.주소).join("\n");
  (s.슬라이드 || []).forEach((src, i) => {
    const img = document.getElementById("pv" + (i + 1));
    if (img && src) img.src = src;
  });
}
async function boot(){
  const s = await fetch("site.json?v=" + Date.now()).then(r => r.json());
  loaded = s;
  fill(s);
}
</script>
</body>
</html>
