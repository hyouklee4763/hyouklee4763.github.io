<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>예진미디어 글 수정</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  :root { --bg:#10110e; --surface:#181b14; --fg:#f4efe4; --muted:#b2ab9c; --accent:#d6ff3e; --ink:#14160c; --line:#2e3326; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:Pretendard,"Apple SD Gothic Neo",sans-serif; line-height:1.5; }
  .wrap { width:min(720px, calc(100% - 32px)); margin:0 auto; padding:32px 0 64px; }
  h1 { font-size:32px; letter-spacing:-.04em; margin:0 0 8px; }
  p { color:var(--muted); }
  label { display:block; margin:16px 0 6px; font-size:13px; color:var(--muted); }
  input, textarea { width:100%; background:#10120c; color:var(--fg); border:1px solid var(--line); border-radius:12px; padding:12px; font:inherit; }
  textarea { min-height:88px; }
  button, .btn { display:inline-flex; align-items:center; justify-content:center; height:48px; padding:0 18px; border-radius:999px; background:var(--accent); color:var(--ink); font-weight:800; border:0; font:inherit; cursor:pointer; text-decoration:none; }
  .ghost { background:transparent; color:var(--fg); border:1px solid var(--line); }
  .row { display:flex; gap:10px; flex-wrap:wrap; margin-top:22px; }
  .note { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; }
  .ok { color:var(--accent); font-weight:700; }
  img.preview { width:100%; border-radius:12px; margin-top:8px; }
</style>
</head>
<body>
<main class="wrap">
  <h1>홈페이지 글 수정</h1>
  <p>글을 고친 뒤 <b style="color:#f4efe4">홈페이지에 반영</b>을 누르세요. 1–2분 뒤 사이트에 나타납니다.</p>
  <div id="lock" class="note">
    <label>비밀번호</label>
    <input id="gate" type="password" autocomplete="current-password" />
    <div class="row"><button type="button" id="open">들어가기</button></div>
    <p id="gateerr"></p>
  </div>
  <form id="form" hidden>
    <div class="note" id="tokenbox">
      <p>처음 한 번만 하면 됩니다. 아래 링크에서 토큰을 만들어 붙여 넣으세요. 이 브라우저에만 저장되고, 홈페이지에는 안 보입니다.</p>
      <p><a href="https://github.com/settings/tokens/new?scopes=public_repo&description=예진미디어%20수정" target="_blank" rel="noopener">토큰 만들기</a>를 연 다음, 만료는 90일, 초록색 <b style="color:#f4efe4">Generate token</b>을 누르고 나온 글자를 복사하세요.</p>
      <label>깃허브 토큰</label>
      <input id="token" type="password" autocomplete="off" />
      <div class="row"><button type="button" id="savetoken" class="ghost">토큰 저장</button></div>
      <p id="tokenstate"></p>
    </div>
    <label>작은 제목</label>
    <input id="작은제목" />
    <label>큰 제목 (줄 바꾸려면 엔터)</label>
    <textarea id="큰제목"></textarea>
    <label>소개</label>
    <textarea id="소개"></textarea>
    <label>상담 문구</label>
    <input id="상담문구" />
    <label>경력</label>
    <textarea id="경력"></textarea>
    <label>전화번호</label>
    <input id="전화번호" />
    <label>주소</label>
    <input id="주소" />
    <label>숏츠 주소 (한 줄에 하나)</label>
    <textarea id="숏츠"></textarea>
    <label>가로 영상 주소 (한 줄에 하나)</label>
    <textarea id="가로영상"></textarea>
    <label>맨 위 사진 바꾸기 (선택)</label>
    <input id="photo" type="file" accept="image/*" />
    <img id="preview" class="preview" alt="" hidden />
    <div class="row">
      <button type="submit">홈페이지에 반영</button>
      <a class="btn ghost" href="./">사이트로 돌아가기</a>
    </div>
    <p id="msg"></p>
  </form>
</main>
<script>
const PIN = "yejin4763";
const REPO = "hyouklee4763/hyouklee4763.github.io";
const KEYS = ["작은제목","큰제목","소개","상담문구","경력","전화번호","주소"];
const gate = document.getElementById("gate");
document.getElementById("open").onclick = () => {
  if (gate.value !== PIN) { document.getElementById("gateerr").textContent = "비밀번호가 다릅니다."; return; }
  document.getElementById("lock").hidden = true;
  document.getElementById("form").hidden = false;
  boot();
};
function token(){ return localStorage.getItem("yejin-gh-token") || ""; }
function paintToken(){
  document.getElementById("tokenstate").textContent = token() ? "이 브라우저에 토큰이 저장되어 있습니다." : "토큰이 아직 없습니다.";
}
document.getElementById("savetoken").onclick = () => {
  const v = document.getElementById("token").value.trim();
  if (!v) return;
  localStorage.setItem("yejin-gh-token", v);
  document.getElementById("token").value = "";
  paintToken();
};
function lines(id){ return document.getElementById(id).value.split(/\n/).map(s => s.trim()).filter(Boolean); }
function collect(){
  const s = {};
  KEYS.forEach(k => s[k] = document.getElementById(k).value.trim());
  s.숏츠 = lines("숏츠");
  s.가로영상 = lines("가로영상");
  return s;
}
function fill(s){
  KEYS.forEach(k => { if (s[k]) document.getElementById(k).value = s[k]; });
  document.getElementById("숏츠").value = (s.숏츠||[]).join("\n");
  document.getElementById("가로영상").value = (s.가로영상||[]).join("\n");
}
async function boot(){
  paintToken();
  const s = await fetch("site.json").then(r => r.json());
  fill(s);
}
function b64(str){ return btoa(unescape(encodeURIComponent(str))); }
async function gh(path, opt){
  const res = await fetch("https://api.github.com/repos/" + REPO + "/contents/" + path, Object.assign({
    headers: { Authorization: "Bearer " + token(), Accept: "application/vnd.github+json" }
  }, opt || {}));
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.message || "저장에 실패했습니다.");
  return data;
}
document.getElementById("photo").onchange = () => {
  const file = document.getElementById("photo").files[0];
  const img = document.getElementById("preview");
  if (!file) { img.hidden = true; return; }
  img.src = URL.createObjectURL(file);
  img.hidden = false;
};
document.getElementById("form").onsubmit = async (e) => {
  e.preventDefault();
  const msg = document.getElementById("msg");
  if (!token()) { msg.textContent = "먼저 토큰을 저장해 주세요."; return; }
  msg.textContent = "저장하는 중입니다.";
  try {
    const body = JSON.stringify(collect(), null, 2) + "\n";
    const cur = await gh("site.json");
    await gh("site.json", { method:"PUT", headers:{ Authorization:"Bearer "+token(), Accept:"application/vnd.github+json", "Content-Type":"application/json" }, body: JSON.stringify({ message:"홈페이지 글 수정", content:b64(body), sha:cur.sha, branch:"main" }) });
    const file = document.getElementById("photo").files[0];
    if (file) {
      const dataUrl = await file.arrayBuffer();
      let binary = "";
      const bytes = new Uint8Array(dataUrl);
      for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
      const photo = await gh("king-master-wide.jpg");
      await gh("king-master-wide.jpg", { method:"PUT", headers:{ Authorization:"Bearer "+token(), Accept:"application/vnd.github+json", "Content-Type":"application/json" }, body: JSON.stringify({ message:"맨 위 사진 교체", content:btoa(binary), sha:photo.sha, branch:"main" }) });
    }
    msg.className = "ok";
    msg.textContent = "반영했습니다. 1–2분 뒤 사이트를 새로고침하세요.";
  } catch (err) {
    msg.className = "";
    msg.textContent = "저장하지 못했습니다. 토큰을 다시 만들어 저장해 주세요. (" + err.message + ")";
  }
};
</script>
</body>
</html>
